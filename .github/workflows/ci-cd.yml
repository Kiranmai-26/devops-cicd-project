name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t kiranmai8008/devops-cicd-project:latest .

      - name: Push Docker image
        run: |
          docker push kiranmai8008/devops-cicd-project:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull kiranmai8008/devops-cicd-project:latest
            sudo docker stop devops-react-app || true
            sudo docker rm devops-react-app || true
            sudo docker run -d \
              --name devops-react-app \
              -p 80:80 \
              --restart unless-stopped \
              kiranmai8008/devops-cicd-project:latest